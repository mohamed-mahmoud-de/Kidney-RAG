# Render blueprint — one-click deploy for Kidney-RAG.
# After merging this to `main`, go to https://dashboard.render.com/blueprints
# → "New Blueprint Instance" → pick this repo. Render reads this file and
# provisions the service automatically. Every subsequent push to `main` triggers
# an auto-redeploy — that IS your CI/CD.
#
# The free plan has 512 MB RAM. MedEmbed-large (1.3 GB on disk, ~1.1 GB resident
# after loading + Chroma + FastAPI) is tight. If the service OOMs during boot,
# bump `plan: free` to `plan: starter` ($7/mo, 512 MB → 2 GB). Downgrade after
# judging.
services:
  - type: web
    name: kidney-rag
    runtime: python
    plan: free
    region: frankfurt          # closest to the team; swap to `oregon` / `singapore` as needed
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn web.backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # HuggingFace cache lives on the persistent disk mount so MedEmbed
      # doesn't re-download on every cold start.
      - key: HF_HOME
        value: /opt/render/project/.hf_cache
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/.hf_cache
      # Secrets — set these once in the Render dashboard ("Environment" tab).
      # `sync: false` tells Render NOT to try to copy them from another env.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
